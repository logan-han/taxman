name: ATO Rates Watch

permissions:
  contents: read
  issues: write

on:
  schedule:
    # Sunday 19:00 UTC = Monday 05:00/06:00 AEST, weekly
    - cron: '0 19 * * 0'
  workflow_dispatch:

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check ATO pages against shipped data
        id: sentinel
        run: |
          set +e
          npx vite-node scripts/check-ato-rates.ts > report.md 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: File or update the sentinel issue
        if: steps.sentinel.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create ato-sentinel --description "Automated ATO rates watch" --color D93F0B --force
          if [ "${{ steps.sentinel.outputs.code }}" = "2" ]; then
            TITLE="ATO rates drift detected"
          else
            TITLE="ATO rates sentinel blocked - manual check needed"
          fi
          EXISTING=$(gh issue list --label ato-sentinel --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file report.md
          else
            gh issue create --title "$TITLE" --label ato-sentinel --body-file report.md
          fi

      - name: Fail the run on drift
        if: steps.sentinel.outputs.code == '2'
        run: exit 1
